<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle do Carrinho</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="controle">

    <!-- Topo: título, status da conexão e IP do carrinho -->
    <header class="topo">
      <div>
        <p class="sobretitulo">Carrinho ESP32</p>
        <h1>Controle do carrinho</h1>
        <p class="subtitulo">Mantenha pressionado para mover</p>
      </div>

      <div class="conexao">
        <div id="status" class="pilula" role="status">
          <span class="ponto"></span>
          <span id="status-texto">Desconectado</span>
        </div>

        <form id="form-conexao">
          <input id="campo-ip" placeholder="IP do carrinho" autocomplete="off" spellcheck="false" aria-label="Endereço IP do carrinho">
          <button id="botao-conectar" type="submit">Conectar</button>
        </form>
      </div>
    </header>

    <!-- Mapa: simulação do caminho do carrinho (não usa dados reais) -->
    <section class="mapa-bloco">
      <div class="mapa" role="img" aria-label="Visão do carrinho com o caminho percorrido">
        <span class="bussola">N</span>

        <div class="mundo">
          <div class="grade"></div>

          <svg class="rota" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polyline class="rota-borda"></polyline>
            <polyline class="rota-linha"></polyline>
            <polyline class="rota-tracejado"></polyline>
          </svg>

          <!-- Carrinho visto de cima (a frente aponta para cima) -->
          <div id="carro" class="carro">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <g fill="#2a3440">
                <rect x="3" y="4.4" width="6.2" height="9" rx="2.4"/>
                <rect x="30.8" y="4.4" width="6.2" height="9" rx="2.4"/>
                <rect x="3" y="26.6" width="6.2" height="9" rx="2.4"/>
                <rect x="30.8" y="26.6" width="6.2" height="9" rx="2.4"/>
              </g>
              <rect x="6.8" y="6.4" width="26.4" height="27.2" rx="9" fill="#eef4f9" stroke="#aebfce" stroke-width="1.6"/>
              <path d="M12.2 15.6 12.8 10.9A4 4 0 0 1 16.2 8h7.6a4 4 0 0 1 3.4 2.9l.7 4.7" fill="#354b63" stroke="#27394d" stroke-width="1" stroke-linejoin="round"/>
              <rect x="12.9" y="16.4" width="14.2" height="9.6" rx="4" fill="#5c84ad" stroke="#4a6f96" stroke-width="1"/>
              <circle cx="10.8" cy="9.4" r="1.7" fill="#ffd76a"/>
              <circle cx="29.2" cy="9.4" r="1.7" fill="#ffd76a"/>
              <g fill="#e0524f">
                <rect x="11.6" y="30.4" width="4" height="2.2" rx="1.1"/>
                <rect x="24.4" y="30.4" width="4" height="2.2" rx="1.1"/>
              </g>
            </svg>
          </div>
        </div>

        <button id="reiniciar-mapa" class="reiniciar" type="button" aria-label="Reiniciar posição">↺</button>
      </div>
      <p class="legenda">Pré-visualização</p>
    </section>

    <!-- Painel: mostra exatamente o que é enviado ao carrinho -->
    <section class="painel" aria-live="polite">
      <div>
        <p class="rotulo">Estado atual</p>
        <p class="estado"><span id="marcador" class="marcador"></span><span id="estado-texto">Parado</span></p>
      </div>

      <div class="divisor"></div>

      <div>
        <p class="rotulo">Rodas</p>
        <div class="rodas">
          <span></span><span>Esq</span><span>Dir</span>
          <span>Frente</span><i data-roda="fe"></i><i data-roda="fd"></i>
          <span>Trás</span><i data-roda="te"></i><i data-roda="td"></i>
        </div>
      </div>
    </section>

    <p class="mensagem">Enviando: <code id="json">{}</code></p>

    <!-- Controle: 4 direções (cada uma liga duas rodas, veja js/direcoes.js) -->
    <!-- A seta é a mesma nos quatro; o CSS só gira o ícone -->
    <section class="direcoes">
      <button data-direcao="cima">
        <span class="icone"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5"/></svg></span>
        <span>Acelerar</span>
      </button>
      <button data-direcao="esquerda">
        <span class="icone"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5"/></svg></span>
        <span>Esquerda</span>
      </button>
      <button data-direcao="direita">
        <span class="icone"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5"/></svg></span>
        <span>Direita</span>
      </button>
      <button data-direcao="baixo">
        <span class="icone"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5"/></svg></span>
        <span>Ré</span>
      </button>

      <button id="parar" type="button">
        <span class="parar-simbolo"><span></span></span>
        <span>PARAR</span>
      </button>
    </section>

    <footer class="rodape">Setas do teclado para mover · Espaço para parar</footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
